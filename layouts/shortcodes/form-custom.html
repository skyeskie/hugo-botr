{{- /*
Adapted from Ananke theme

@param {String} [action] URL to submit the form data via POST

*/ -}}

{{ $.Scratch.Add "labelClasses" "f6 b db mb1 mt3 sans-serif light-gray" }}
{{ $.Scratch.Add "inputClasses" "w-100 f5 pv3 ph3 bg-dark-gray light-gray bn" }}
{{ $req := "<span class=\"form-required\">*</span>" | safeHTML }}

<form class="sans-serif tl" accept-charset="UTF-8" action="{{ .Get "action" }}" method="POST" role="form">
    <label class="{{ $.Scratch.Get "labelClasses" }}">
        {{ $req }} Indicates required field
    </label>
    {{ .Inner }}
    <input class="dib pointer mv4 white pa3 bn br-pill hover-bg-black bg-animate bg-dark-gray"
           type="submit" value="{{ lang.Translate "submit" | default "Submit" }}" />
</form>
