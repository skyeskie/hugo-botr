{{ $pl_id := .Get 0 }}
<div class="youtube-full"><iframe class="youtube-iframe"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        src="https://www.youtube.com/embed?listType=playlist&list={{ $pl_id }}"
        title="Youtube Video">
</iframe></div>
