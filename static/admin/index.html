<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
</head>
<body>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
<script>
    // from https://github.com/sharadcodes/hugo-shortcodes-netlify-cms/blob/master/src/youtube.js
    CMS.registerEditorComponent({
        id: "youtube",
        label: "Youtube",
        fields: [{
            name: "id",
            label: "Youtube Video ID",
            widget: "string"
        },
        {
            name: "pre",
            label: "Whether to include ID prefix",
            widget: "hidden"
        }],
        pattern: /{{< youtube\s+(?<pre>(?:id\s*=\s*)?)(?<id>[A-Za-z0-9\-_]+)\s+>}}/,
        fromBlock: function(match) {
            return match.groups;
        },
        toBlock: function(obj) {
            return `{{< youtube ${obj.pre}${obj.id} >}}`;
        },
        toPreview: function(obj) {
            return `<img src="https://i3.ytimg.com/vi/${obj.id}/hqdefault.jpg" alt="Youtube Video"/>`;
        },
    });
    const SelectControl = CMS.getFieldType('select').control;
    const ConcertSelectControl = createClass({
        render: function() {
            const dates = this.props.entry.getIn(['data', 'dates'])
            console.log(this.props);
            const options = (dates?.toJS() ?? [])
                .map((d) => dayjs(d.date).format('MMM D ') + d.location)
                .filter((d) => !!d)
                .map((d) => ({label: d, value: d }));
            console.log(options);
            return h(SelectControl, {
                field: { name: this.props.field.get('name'), options },
                value: this.props.value,
                forID: this.props.forID,
                onChange: this.props.onChange,
            })
        }
    })
    CMS.registerFieldType('concert-select', ConcertSelectControl);
    //TODO: Add form shortcode
</script>

</body>
</html>
