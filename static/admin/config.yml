# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Bells of the Rockies Admin

backend:
  name: github
  repo: skyeskie/hugo-botr
  branch: sveltia
#  squash_merges: true
#
#publish_mode: editorial_workflow

media_folder: assets/images
public_folder: /images

# noinspection YAMLSchemaValidation
basic_fields: &basic_fields
  fields:
    - name: title
    - name: featured_image
      widget: image
    - name: body
      widget: richtext

collections:
  - name: main
    label: Main Site Pages
    files:
      - name: index
        label: Home Page
        file: content/_index.md
        <<: *basic_fields
      - name: about
        label: About Us
        file: content/about-us.md
        <<: *basic_fields
      - name: audition
        label: Audition
        file: content/audition.md
        <<: *basic_fields
      - name: concerts
        label: Concerts
        file: content/concerts.md
        <<: *basic_fields
      - name: repertoire
        label: Repertoire
        file: content/repertoire.md
        <<: *basic_fields
      - name: support
        label: Support
        file: content/support.md
        <<: *basic_fields
      - name: ringers
        label: Ringers
        file: content/ringers/_index.md
        <<: *basic_fields
  - name: ringers
    label: Ringer Bios
    folder: content/ringers
    media_folder: /assets/ringers
    public_folder: /ringers
    sortable_fields:
      fields: [title, weight, sort]
      default:
        field: sort
    index_file:
      label: 'Ringers Index Description'
      <<: *basic_fields
    view_groups:
      groups:
      - name: director
        field: director
        label: Director
      default: director
    fields:
      - name: first
        label: First Name
        widget: string
      - name: last
        label: Last Name
        widget: string
      - name: title
        label: Full Name
        widget: compute
        value: '{{fields.first}} {{fields.last}}'
      - name: director
        label: Director
        widget: boolean
        default: false
        readonly: true
        preview: false
      - name: sort
        label: Sort (by text)
        widget: compute
        value: '{{fields.last}}, {{fields.first}}'
      - name: weight
        hint: 'Deprecated if use alpha sort'
        label: Sort (numeric)
        widget: number
      - name: photo
        label: Ringer Photo
        widget: image
      - name: body
        widget: richtext
  - name: locations
    label: Concert Locations
    folder: content/locations
    fields:
#      - name: id
#        label: Location ID
#        hint: Internal use for references
#        widget: string
#        required: true
      - name: title
        label: Display Name
        widget: string
        required: true
      - name: image
        widget: image
        required: false
      - name: street
        label: Street Address
        widget: string
      - name: city
        label: City
        widget: string
      - name: state
        label: State Code
        maxlength: 2
        widget: string
#      - name: address2
#        widget: compute
#        value: '{{fields.street}} | {{fields.city}}, {{fields.state}}'
  - name: repertoire
    label: Repertoire Pieces
    folder: content/repertoire
    fields:
      - name: id
        label: Piece ID # Filename?
        widget: string
        required: true
      - name: title
        label: Piece Title
        widget: string
        required: true
      - name: composer
        label: Composer
        widget: list
        min: 1
        hint: If unknown, use appropriate generic (Spiritual)
      - name: arranger
        label: Arranger
        comment: "arr. "
        required: false
      - name: adapter
        label: Adapted By
        required: false
      - name: sheet_music
        label: Music URL
        widget: string
        required: false
      - name: body
        label: Extra Info
        comment: Lyrics, concert notes?
        required: false
  - name: concerts
    label: Concerts
    folder: content/concerts
    media_folder: /assets/concerts
    public_folder: /concerts
    sortable_fields:
      fields: [title, sort]
      default:
        field: sort
    fields:
      - name: year
        label: Year
        widget: number
        min: 1996
        max: 2100
      - name: season
        label: Season/Month
        widget: string
      - name: poster
        label: Promotional Poster
        widget: image
        required: false
      - name: logo
        label: Concert Logo
        comment: Should be similar to poster, without text details
        widget: image
        required: false
      - name: extra
        label: Extra Description
        hint: "Ex: Area 11 Festival. Usually blank"
        required: false
        # TODO: See if can calculate sort string
      - name: sort
        label: Sort String
        hint: Should force to roughly time order
        widget: string
      - name: title
        label: Program Title
        widget: string
      - name: body
        label: Page Description
        widget: richtext
        required: false
      - name: dates
        label: Concert Dates
        widget: list
        min: 1
        fields:
          - name: date
            widget: datetime
            type: datetime-local
            step: 300
          - name: location
            widget: relation
            collection: locations
      - name: selections
        label: Music Selections
        widget: list
        fields:
          - name: song
            label: Song
            widget: relation
            collection: repertoire
          - name: subtitle
            label: Subtitle
            comment: Concert-specific subtitle (Wonder)
            widget: string
            required: false
          - name: instrumentalists
            label: Instrumentalists
            required: false
            widget: keyvalue
            key_label: Instrument
            value_label: Player
          - name: videos
            label: YouTube Videos
            widget: list
            required: false
            fields:
              - name: performance
                label: Concert Date
                comment: Reference dates above
                # TODO: Ref dates above
                widget: string
                required: false # For now
              - name: youtube
                label: YouTube ID
                required: true
              - name: public_after
                label: Publish After
                widget: datetime
                type: date
                comment: Use to delay when release. Will require rebuild.
