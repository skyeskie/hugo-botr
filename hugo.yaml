baseURL: https://www.bellsoftherockies.org/
locale: en-us
title: Bells of the Rockies

privacy:
  youtube:
    privacyEnhanced: true

module:
  imports:
  - path: github.com/gohugo-ananke/ananke/v2
    disable: false
    ignoreConfig: false
    ignoreImports: false
#  - path: github.com/hugomods/images

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderHooks:
      image:
        useEmbedded: fallback
      link:
        useEmbedded: fallback
    renderer:
      hardWraps: true
