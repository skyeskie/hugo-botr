baseURL: https://www.bellsoftherockies.org/
locale: en-us
title: Bells of the Rockies

privacy:
  youtube:
    privacyEnhanced: true

module:
  imports:
  - path: github.com/gohugo-ananke/ananke/v2
    disable: false
    ignoreConfig: false
    ignoreImports: false
#  - path: github.com/hugomods/images

caches:
  images:
    dir: :cacheDir/images

taxonomies:
  composer: composer
  arranger: arranger
  adapted: adapted
  transcriber: transcriber
  # Need to maintain abbreviated from "selections"
  repertoire: repertoire

permalinks:
  - pattern: /writer/
    kind: {taxonomy,term}
    target:
      path: '{/arranger,/adapted,/transcriber,/composer}'
  - pattern: /writer/:slug/
    kind: { taxonomy,term }
    target:
      path: '{/arranger/**,/adapted/**,/transcriber/**,/composer/**}'

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderHooks:
      image:
        useEmbedded: fallback
      link:
        useEmbedded: fallback
    renderer:
      hardWraps: true
